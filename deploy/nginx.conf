server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://titijimmy-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Les bundles sont hashés : immuables pour toujours.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html en no-cache : sans ça, un téléphone qui a ouvert le site le
    # matin garderait le vieux HTML pointant vers un bundle disparu après un
    # correctif déployé dans la journée.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
